<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ARCH 360 Tour</title>
  <!-- PWA: installable app (phones, Meta Quest) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>

  <!-- A-Frame 1.5.0 — no extra dependencies needed -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Camera positions + walk graph exported from the Blender scene -->
  <script src="tour_data.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; overflow: hidden; height: 100%; }

    /* Loading overlay */
    #loading-screen {
      position: fixed; inset: 0;
      background: #080c12;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 200;
      color: #e8edf2;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.6s ease;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 22px;
    }
    .loading-title  { font-size: 1.1em; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
    .loading-sub    { font-size: 0.72em; margin-top: 8px; opacity: 0.38; letter-spacing: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* HUD overlay — hidden in VR automatically */
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 18px 20px 28px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      text-align: center;
      pointer-events: none;
      z-index: 10;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.4s;
    }
    #scene-name {
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e8edf2;
      margin-bottom: 5px;
    }
    #nav-hint {
      font-size: clamp(10px, 1.8vw, 12px);
      color: rgba(232,237,242,0.4);
      letter-spacing: 1px;
    }

    /* Back button */
    #back-btn {
      position: fixed; top: 18px; left: 18px;
      background: rgba(8,12,18,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: rgba(232,237,242,0.65);
      font-size: 0.8em;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 14px;
      display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(12px);
      z-index: 10;
      transition: color 0.2s, border-color 0.2s;
    }
    #back-btn:hover { color: #e8edf2; border-color: rgba(255,255,255,0.25); }

    #scene-select {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(0,0,0,1);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 12px;
      font-family: Avenir, sans-serif;
      font-size: 10px;
      outline: none;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Wide view — the whole 2:1 panorama image, flat, with the circles marked on it */
    #wide-btn {
      position: fixed; top: 18px; left: 66px; z-index: 10;
      background: rgba(8,12,18,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
      color: rgba(232,237,242,0.8); font: 0.8em 'Segoe UI', system-ui, sans-serif; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(12px);
    }
    #wide-btn:hover { color: #e8edf2; border-color: rgba(255,255,255,0.25); }
    #wide-overlay {
      position: fixed; inset: 0; z-index: 10000; background: #000;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e8edf2;
    }
    #wide-overlay.open { display: flex; }
    #wide-title { font-size: clamp(12px, 2.2vw, 16px); font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
    #wide-frame { position: relative; width: min(96vw, calc((100vh - 110px) * 2)); aspect-ratio: 2 / 1; }
    #wide-img { width: 100%; height: 100%; display: block; }
    .wide-pin {
      position: absolute; transform: translate(-50%, -50%); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: 0; color: #fff; font: inherit;
    }
    .wide-pin .ring { width: 22px; height: 22px; border: 3px solid #fff; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .wide-pin .name { order: -1; font-size: 11px; background: rgba(0,0,0,0.7); padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
    .wide-pin:hover .ring { border-color: #4fc3f7; background: rgba(79,195,247,0.35); }
    /* Enter-VR button + controller guide shown before VR starts — same look as the home page */
    #vr-btn {
      position: fixed; right: 20px; bottom: 22px; z-index: 11; display: none;
      background: #000; border: 1px solid rgba(255,255,255,0.14); border-radius: 0;
      color: #fff; font: 600 0.8em 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 12px 20px; cursor: pointer; align-items: center; gap: 10px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    #vr-btn.show { display: flex; }
    #vr-btn:hover { background: #fff; color: #000; transform: translateY(-2px); }
    /* A-Frame's own VR / fullscreen button: replaced by #vr-btn (which shows the controller guide first) */
    .a-enter-vr, .a-enter-ar { display: none !important; }
    #guide {
      position: fixed; inset: 0; z-index: 10001; background: #000;
      display: none; align-items: center; justify-content: center; padding: 24px 16px; overflow-y: auto;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif; color: #e8edf2;
    }
    #guide.open { display: flex; }
    .guide-card { width: min(620px, 100%); text-align: center; margin: auto; }
    .guide-logo { width: 84px; max-width: 30vw; height: auto; display: block; margin: 0 auto 12px; }
    .guide-step-no { font-size: 0.72em; letter-spacing: 4px; text-transform: uppercase; color: rgba(232,237,242,0.45); }
    .guide-title { font-size: clamp(1.7rem, 5vw, 2.6rem); font-weight: 200; letter-spacing: -0.5px; line-height: 1.15; margin: 8px 0 8px; }
    .guide-text { font-size: clamp(0.92rem, 2vw, 1.05rem); line-height: 1.7; color: rgba(232,237,242,0.6); max-width: 480px; margin: 0 auto; min-height: 3.4em; }
    .guide-pics { display: flex; justify-content: center; gap: 22px; margin: 16px 0 4px; }
    .guide-pics > div {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      padding: 16px 14px 12px;
    }
    .guide-pics svg { width: min(130px, 34vw); height: auto; display: block; }
    .guide-pics .cap { font-size: 0.68em; letter-spacing: 3px; text-transform: uppercase; color: rgba(232,237,242,0.45); margin-top: 8px; }
    .ctl-body { fill: #0b1017; stroke: rgba(255,255,255,0.3); stroke-width: 2; }
    .ctl-part { fill: #161d27; stroke: rgba(255,255,255,0.4); stroke-width: 1.5; }
    .ctl-label { fill: rgba(232,237,242,0.7); font: 600 12px 'Segoe UI', system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; letter-spacing: 1px; }
    .ctl-hl { fill: #00c8ff; stroke: #9ae9ff; animation: ctl-pulse 1.2s ease-in-out infinite; }
    .ctl-label.on { fill: #001018; }
    .ctl-arrow { fill: #00c8ff; font: 700 15px 'Segoe UI', system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    @keyframes ctl-pulse { 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { .ctl-hl { animation: none; } }
    .guide-dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0 18px; }
    .guide-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.18); }
    .guide-dots span.on { background: #00c8ff; }
    .guide-nav { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .guide-nav button, #guide-skip {
      background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.14); border-radius: 0;
      font: 600 0.85em 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      letter-spacing: 1.5px; text-transform: uppercase; padding: 14px 32px; cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .guide-nav button:hover, #guide-skip:hover { background: #fff; color: #000; transform: translateY(-2px); }
    #guide-next { min-width: 170px; border-color: rgba(255,255,255,0.45); }
    #guide-back[disabled] { display: none; }
    .guide-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.72em; letter-spacing: 2px; text-transform: uppercase; color: rgba(232,237,242,0.45);
    }
    .guide-foot label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .guide-foot input { accent-color: #00c8ff; }
    #guide-skip { padding: 9px 16px; font-size: 0.95em; letter-spacing: 2px; color: rgba(232,237,242,0.75); }

    #wide-close {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
      color: #e8edf2; padding: 9px 18px; letter-spacing: 1.5px; text-transform: uppercase; font: 0.8em inherit; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p class="loading-title">ARCH 360 Tour</p>
  <p class="loading-sub">Preparing your experience…</p>
</div>

<!-- HUD -->
<a href="index.html" id="back-btn">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
</a>
<button id="wide-btn" title="See the whole panorama at once">Wide</button>
<select id="scene-select"></select>
<div id="wide-overlay">
  <div id="wide-title"></div>
  <div id="wide-frame"><img id="wide-img" alt="Full panorama"><div id="wide-pins"></div></div>
  <button id="wide-close">Back to 360 view</button>
</div>

<!-- Enter VR: first a short guide to the Quest controllers, then VR starts -->
<button id="vr-btn" title="View in a VR headset">
  <svg width="22" height="14" viewBox="0 0 44 28" fill="currentColor" aria-hidden="true"><path d="M6 2h32a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4h-9l-4-6a3.6 3.6 0 0 0-6 0l-4 6H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4zm7 6.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm18 0a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
  Enter VR
</button>
<div id="guide" role="dialog" aria-modal="true" aria-labelledby="guide-title">
  <div class="guide-card">
    <img class="guide-logo" src="images/logo.png" alt="Digital Arc Media">
    <div class="guide-step-no" id="guide-step-no"></div>
    <div class="guide-title" id="guide-title"></div>
    <div class="guide-text" id="guide-text"></div>
    <div class="guide-pics" id="guide-pics"></div>
    <div class="guide-dots" id="guide-dots"></div>
    <div class="guide-nav">
      <button id="guide-back">Back</button>
      <button id="guide-next">Next</button>
    </div>
    <div class="guide-foot">
      <label><input type="checkbox" id="guide-hide"> Don't show this again</label>
      <button id="guide-skip">Skip &amp; enter VR</button>
    </div>
  </div>
</div>
<div id="hud">
  <div id="scene-name">Loading…</div>
  <div id="nav-hint">Click a circle on the floor to walk there</div>
</div>

<!-- ═══════════════════════════════════════════════════════════ A-FRAME ══ -->
<a-scene
  id="a-scene"
  renderer="colorManagement: true; antialias: true; physicallyCorrectLights: false; renderScale: 1"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  background="color: #000000">

  <!--
    Sky sphere. Every Blender camera faces world +Y, which becomes A-Frame −Z,
    so the centre of each panorama must sit in front of the viewer (−Z).
    A-Frame maps the image centre to −X by default, hence the −90° turn.
  -->
  <a-sky
    id="sky"
    follow-eye
    radius="490"
    segments-height="64"
    segments-width="128"
    rotation="0 -90 0"
    material="depthWrite: false"
    color="#0d1a28">
  </a-sky>

  <!-- The viewer stands exactly where the Blender camera was (eye at the rig origin) -->
  <a-entity id="rig" position="0 0 0" snap-turn hold-to-exit wide-view>
    <a-entity
      id="cam"
      camera="fov: 80; near: 0.05; far: 600"
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; pointerLockEnabled: false"
      position="0 0 0">

      <!-- Gaze cursor: fuse = fires "click" after fuseTimeout ms of hover (VR / phone) -->
      <a-entity
        id="gaze-cursor"
        cursor="fuse: true; fuseTimeout: 1800; rayOrigin: entity"
        raycaster="objects: .hs-target; far: 600; interval: 80"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.011"
        material="color: #ffffff; shader: flat; opacity: 0.8; transparent: true"
        animation__fusing_scale="property: scale; startEvents: fusing; from: 1 1 1; to: 1.3 1.3 1.3; dur: 1800; easing: easeInQuad"
        animation__leave_scale="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200"
        animation__click_pop="property: scale; startEvents: click; from: 0.7 0.7 0.7; to: 1 1 1; dur: 300">
      </a-entity>

      <!-- Exit-VR progress: shown while B / Y is held; fills up over 2 s, then leaves VR -->
      <a-entity id="exit-progress" position="0 0 -0.7" visible="false">
        <a-ring radius-inner="0.045" radius-outer="0.055"
          material="color: #ffffff; opacity: 0.25; transparent: true; shader: flat; depthTest: false"></a-ring>
        <a-entity id="exit-ring"
          geometry="primitive: ring; radiusInner: 0.045; radiusOuter: 0.055; thetaStart: 90; thetaLength: 0"
          material="color: #ffffff; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false"></a-entity>
        <a-text value="Hold to exit VR" align="center" width="0.6" color="#ffffff" position="0 -0.09 0"
          material="depthTest: false"></a-text>
      </a-entity>

      <!-- Wide-view progress: shown while A / X is held; after 1 s it switches Wide view on/off -->
      <a-entity id="wide-progress" position="0 0 -0.7" visible="false">
        <a-ring radius-inner="0.045" radius-outer="0.055"
          material="color: #ffffff; opacity: 0.25; transparent: true; shader: flat; depthTest: false"></a-ring>
        <a-entity id="wide-ring"
          geometry="primitive: ring; radiusInner: 0.045; radiusOuter: 0.055; thetaStart: 90; thetaLength: 0"
          material="color: #4fc3f7; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false"></a-entity>
        <a-text id="wide-text" value="Hold for Wide view" align="center" width="0.6" color="#ffffff" position="0 -0.09 0"
          material="depthTest: false"></a-text>
      </a-entity>

      <!-- Fade plane — black quad in front of the camera for scene transitions -->
      <a-plane
        id="fade"
        width="6" height="6"
        position="0 0 -1"
        material="color: #000000; opacity: 0; transparent: true; shader: flat; depthTest: false; depthWrite: false"
        visible="false">
      </a-plane>
    </a-entity>

    <!-- Quest / PCVR controllers -->
    <a-entity id="ctrl-left"  laser-controls="hand: left"  raycaster="objects: .hs-target, .wide-target; showLine: false; far: 600"></a-entity>
    <a-entity id="ctrl-right" laser-controls="hand: right" raycaster="objects: .hs-target, .wide-target; showLine: true; lineColor: #ffffff; lineOpacity: 0.5; far: 600"></a-entity>
  </a-entity>

  <!-- Wide view: a 2:1 screen showing the whole 360 panorama flat, with the circles marked on it -->
  <a-entity id="wide-screen" visible="false"
    geometry="primitive: plane; width: 6; height: 3">
    <a-entity id="wide-markers"></a-entity>
  </a-entity>

  <!-- Mouse / touch clicking on desktop & phone -->
  <a-entity id="mouse-cursor" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .hs-target; far: 600"></a-entity>

  <!-- Hotspot container — rebuilt on every scene change -->
  <a-entity id="hotspots" follow-eye></a-entity>
</a-scene>

<script>
/* ══════════════════════════════════════════════════════════════════════
   TOUR CONFIGURATION
   Scenes, positions and neighbours come from tour_data.js (exported from
   the Blender file). Blender is Z-up, A-Frame is Y-up:
     aframe.x =  blender.x,  aframe.y = blender.z,  aframe.z = -blender.y
══════════════════════════════════════════════════════════════════════ */
const START_SCENE    = 'out_main_gate';
const GAZE_MS        = 1800;   // must match the gaze cursor fuseTimeout
const MAX_MARKER_M   = 14;     // far circles are pulled in to this distance (direction is kept)
const CIRCLE_RADIUS  = 0.32;   // metres, at true distance → far circles look smaller, like Street View

/* 4K panoramas (3840×1920) — fit every GPU, including phones and Quest. */
const IMG_DIR = 'images/pano/';

const SCENES = {};
for (const s of window.TOUR_SCENES) {
  SCENES[s.id] = {
    name:        s.placeholder ? `${s.name} (coming soon)` : s.name,
    area:        s.area || '',
    image:       IMG_DIR + (s.image || s.id + '.jpg'),
    eye:         { x: s.pos[0], y: s.pos[1], z: s.pos[2] },   // Blender coords
    floorZ:      s.floorZ,
    neighbours:  s.neighbours,
    placeholderColor: '#0d1a28'
  };
}
const SCENE_IDS = Object.keys(SCENES);

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM A-FRAME COMPONENTS
══════════════════════════════════════════════════════════════════════ */

/* face-camera — keeps labels turned toward the viewer */
AFRAME.registerComponent('face-camera', {
  init () { this.camEl = document.querySelector('#cam'); this._v = new THREE.Vector3(); },
  tick () { this.camEl.object3D.getWorldPosition(this._v); this.el.object3D.lookAt(this._v); }
});

/* follow-eye — keeps the panorama and the circles centred on the viewer's head.
   In a headset the eye sits at the user's real height (~1.6 m above the rig) and moves
   when they lean; without this the sphere is off-centre (warped, wrong scale) and the
   floor circles hang far below the floor in the image. */
AFRAME.registerComponent('follow-eye', {
  init () { this.camEl = document.querySelector('#cam'); },
  tick () { this.camEl.object3D.getWorldPosition(this.el.object3D.position); }
});

/* turnView — turns the viewer left (+) or right (−) by `deg` around their own head, so they stay
   exactly at the panorama centre. Works on desktop, phone and in VR (it turns the rig, not the head). */
const _head = new THREE.Vector3(), _after = new THREE.Vector3();
function turnView (deg) {
  const rig = document.querySelector('#rig').object3D, cam = document.querySelector('#cam').object3D;
  cam.getWorldPosition(_head);
  rig.rotation.y += THREE.MathUtils.degToRad(deg);
  rig.updateMatrixWorld(true);
  cam.getWorldPosition(_after);
  rig.position.add(_head.sub(_after));                                // keep the head where it was
}

/* Turn the view when arriving at these locations (degrees). The middle stair landings switch back,
   so turning around puts the next flight in front of the viewer. */
const TURN_ON_ARRIVAL = { gf_staircase_2: 180, ff_staircase_2: 180, sf_staircase_2: 180 };

/* snap-turn — Quest thumbstick left/right turns the view in 30° steps (comfortable, no motion sickness). */
const SNAP_DEG = 30;
AFRAME.registerComponent('snap-turn', {
  init () {
    this.armed = { left: true, right: true };
    for (const hand of ['left', 'right']) {
      document.querySelector('#ctrl-' + hand).addEventListener('thumbstickmoved', e => this.onStick(hand, e.detail.x));
    }
  },
  onStick (hand, x) {
    if (Math.abs(x) < 0.3) { this.armed[hand] = true; return; }      // stick back to centre → ready again
    if (!this.armed[hand] || Math.abs(x) < 0.7 || (wideView && wideView.active)) return;   // in Wide the stick pans the screen
    this.armed[hand] = false;
    turnView(x > 0 ? -SNAP_DEG : SNAP_DEG);                           // right = turn right
  }
});

/* hold-to-exit — hold B (right controller) or Y (left) for 2 s to leave VR and return to the tour page.
   Letting go early cancels it, so a quick accidental press does nothing. */
const EXIT_HOLD_MS = 2000;
AFRAME.registerComponent('hold-to-exit', {
  init () {
    this.box = document.querySelector('#exit-progress');
    this.ring = document.querySelector('#exit-ring');
    this.start = null;
    for (const [hand, btn] of [['right', 'b'], ['left', 'y']]) {
      const ctrl = document.querySelector('#ctrl-' + hand);
      ctrl.addEventListener(btn + 'buttondown', () => this.begin());
      ctrl.addEventListener(btn + 'buttonup', () => this.cancel());
    }
    this.el.sceneEl.addEventListener('exit-vr', () => this.cancel());
  },
  begin () {
    if (!this.el.sceneEl.is('vr-mode')) return;
    this.start = performance.now();
    this.box.setAttribute('visible', true);
  },
  cancel () {
    this.start = null;
    this.box.setAttribute('visible', false);
    this.ring.setAttribute('geometry', 'thetaLength', 0);
  },
  tick () {
    if (this.start === null) return;
    const t = (performance.now() - this.start) / EXIT_HOLD_MS;
    this.ring.setAttribute('geometry', 'thetaLength', Math.min(360, t * 360));
    if (t >= 1) { this.cancel(); this.el.sceneEl.exitVR(); }
  }
});

/* wide-view — hold A (right controller) or X (left) for 1 s to switch to a big flat screen showing the WHOLE
   360° panorama at once (the full 2:1 image, nothing cropped), like the image seen on a PC.
   Hold again to go back to 360. While Wide is on:
   · the 360 sphere and the floating circles are moved to a hidden layer, so only the screen is seen,
   · each circle is marked on the screen at the exact spot it sits in the image; point + trigger walks there. */
const WIDE_HOLD_MS = 1000, WIDE_LAYER = 5, WIDE_W = 6, WIDE_H = 3, WIDE_DIST = 3.2;
let wideView = null;   // the component, so navigation / snap-turn can ask whether Wide is on

/* Where a direction (A-Frame axes, relative to the eye) lands on the equirectangular image: u 0..1 left→right, v 0..1 bottom→top.
   The image centre is straight ahead (−Z); turning right moves right in the image. */
function directionToUV (x, y, z) {
  const lon = Math.atan2(x, -z), lat = Math.atan2(y, Math.hypot(x, z));
  return { u: 0.5 + lon / (2 * Math.PI), v: 0.5 + lat / Math.PI };
}

AFRAME.registerComponent('wide-view', {
  init () {
    wideView = this;
    this.active = false; this.holdStart = null;
    this.camEl = document.querySelector('#cam');
    this.screenEl = document.querySelector('#wide-screen');
    this.markersEl = document.querySelector('#wide-markers');
    this.box = document.querySelector('#wide-progress');
    this.ring = document.querySelector('#wide-ring');
    this.text = document.querySelector('#wide-text');
    this.screenMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
    for (const [hand, btn] of [['right', 'a'], ['left', 'x']]) {
      const ctrl = document.querySelector('#ctrl-' + hand);
      ctrl.addEventListener(btn + 'buttondown', () => this.beginHold());
      ctrl.addEventListener(btn + 'buttonup', () => this.cancelHold());
    }
    this.el.sceneEl.addEventListener('exit-vr', () => { this.cancelHold(); if (this.active) this.setActive(false); });
    this._v = new THREE.Vector3(); this._q = new THREE.Quaternion(); this._e = new THREE.Euler(0, 0, 0, 'YXZ');
  },
  beginHold () {
    if (!this.el.sceneEl.is('vr-mode')) return;
    this.holdStart = performance.now();
    this.text.setAttribute('value', this.active ? 'Hold for 360 view' : 'Hold for Wide view');
    this.box.setAttribute('visible', true);
  },
  cancelHold () {
    this.holdStart = null;
    this.box.setAttribute('visible', false);
    this.ring.setAttribute('geometry', 'thetaLength', 0);
  },
  setActive (on) {
    this.active = on;
    if (on) {
      // put the screen in front of the viewer, at eye height, facing them
      this._e.setFromQuaternion(this.camEl.object3D.getWorldQuaternion(this._q), 'YXZ');
      const yaw = this._e.y;
      this.camEl.object3D.getWorldPosition(this._v);
      this.screenEl.object3D.position.set(this._v.x - Math.sin(yaw) * WIDE_DIST, this._v.y, this._v.z - Math.cos(yaw) * WIDE_DIST);
      this.screenEl.object3D.rotation.set(0, yaw, 0);
      this.screenEl.getObject3D('mesh').material = this.screenMat;
      this.screenEl.setAttribute('visible', true);
      this.refreshMarkers();
    } else {
      this.screenEl.setAttribute('visible', false);
      while (this.markersEl.firstChild) this.markersEl.removeChild(this.markersEl.firstChild);
      document.querySelector('#sky').object3D.traverse(o => o.layers.set(0));
      document.querySelector('#hotspots').object3D.traverse(o => o.layers.set(0));
    }
  },
  /* One marker per circle of the current location, at its spot in the full image. */
  refreshMarkers () {
    while (this.markersEl.firstChild) this.markersEl.removeChild(this.markersEl.firstChild);
    if (!this.active) return;
    for (const id of SCENES[currentScene].neighbours) {
      if (!SCENES[id]) continue;
      const p = markerPosition(currentScene, id), { u, v } = directionToUV(p.x, p.y, p.z);
      const m = document.createElement('a-entity');
      m.setAttribute('position', `${((u - 0.5) * WIDE_W).toFixed(3)} ${((v - 0.5) * WIDE_H).toFixed(3)} 0.01`);
      const ring = document.createElement('a-ring');
      ring.setAttribute('radius-inner', 0.055); ring.setAttribute('radius-outer', 0.075);
      ring.setAttribute('material', 'color: #ffffff; shader: flat; opacity: 0.95; transparent: true');
      m.appendChild(ring);
      const hit = document.createElement('a-circle');               // bigger invisible area, easy to point at
      hit.setAttribute('radius', 0.14);
      hit.setAttribute('class', 'wide-target');
      hit.setAttribute('material', 'opacity: 0; transparent: true; shader: flat; depthWrite: false');
      hit.addEventListener('mouseenter', () => ring.setAttribute('material', 'color', '#4fc3f7'));
      hit.addEventListener('mouseleave', () => ring.setAttribute('material', 'color', '#ffffff'));
      hit.addEventListener('click', () => navigateTo(id));
      m.appendChild(hit);
      const t = SCENES[id], here = SCENES[currentScene];
      const name = (t.area !== here.area && !t.name.toLowerCase().startsWith(t.area.toLowerCase())) ? `${t.area} · ${t.name}` : t.name;
      const label = document.createElement('a-entity');
      label.setAttribute('position', '0 0.15 0.005');
      const bg = document.createElement('a-plane');
      bg.setAttribute('width', Math.max(0.45, name.length * 0.042)); bg.setAttribute('height', 0.1);
      bg.setAttribute('material', 'color: #000000; opacity: 0.7; transparent: true; shader: flat');
      label.appendChild(bg);
      const txt = document.createElement('a-text');
      txt.setAttribute('value', name); txt.setAttribute('align', 'center'); txt.setAttribute('color', '#ffffff');
      txt.setAttribute('width', 0.8); txt.setAttribute('position', '0 0 0.005');
      label.appendChild(txt);
      m.appendChild(label);
      this.markersEl.appendChild(m);
    }
  },
  tick () {
    if (this.holdStart !== null) {
      const p = (performance.now() - this.holdStart) / WIDE_HOLD_MS;
      this.ring.setAttribute('geometry', 'thetaLength', Math.min(360, p * 360));
      if (p >= 1) { this.cancelHold(); this.setActive(!this.active); }
    }
    if (!this.active) return;
    // the screen shows the same panorama texture as the sphere (follows scene changes)
    const skyMesh = document.querySelector('#sky').getObject3D('mesh');
    const map = skyMesh && skyMesh.material.map;
    if (map && this.screenMat.map !== map) { this.screenMat.map = map; this.screenMat.needsUpdate = true; }
    // nobody sees the sphere or the floating circles while Wide is on
    document.querySelector('#sky').object3D.traverse(o => o.layers.set(WIDE_LAYER));
    document.querySelector('#hotspots').object3D.traverse(o => o.layers.set(WIDE_LAYER));
  }
});

/* hotspot-nav — gaze progress ring + navigation on click */
AFRAME.registerComponent('hotspot-nav', {
  schema: { targetId: { type: 'string' }, progressRing: { type: 'selector' }, disc: { type: 'selector' } },
  init () {
    this._onClick = () => navigateTo(this.data.targetId);
    this._onEnter = this._onEnter.bind(this);
    this._onLeave = this._onLeave.bind(this);
    this.el.addEventListener('click', this._onClick);
    this.el.addEventListener('mouseenter', this._onEnter);
    this.el.addEventListener('fusing', this._onEnter);
    this.el.addEventListener('mouseleave', this._onLeave);
  },
  remove () {
    this.el.removeEventListener('click', this._onClick);
    this.el.removeEventListener('mouseenter', this._onEnter);
    this.el.removeEventListener('fusing', this._onEnter);
    this.el.removeEventListener('mouseleave', this._onLeave);
  },
  _onEnter (e) {
    const { progressRing, disc } = this.data;
    if (disc) disc.setAttribute('material', 'opacity', 0.55);
    if (progressRing && e.type === 'fusing') {
      progressRing.setAttribute('animation__prog',
        { property: 'geometry.thetaLength', from: 0, to: 360, dur: GAZE_MS, easing: 'linear' });
    }
  },
  _onLeave () {
    const { progressRing, disc } = this.data;
    if (disc) disc.setAttribute('material', 'opacity', 0.28);
    if (progressRing) { progressRing.removeAttribute('animation__prog'); progressRing.setAttribute('geometry', 'thetaLength', 0); }
  }
});

/* ══════════════════════════════════════════════════════════════════════
   TOUR STATE & HELPERS
══════════════════════════════════════════════════════════════════════ */
let currentScene  = START_SCENE;
let transitioning = false;
const loadedUrls  = new Set();
const failedUrls  = new Set();

const skyEl       = document.querySelector('#sky');
const fadeEl      = document.querySelector('#fade');
const hotspotsEl  = document.querySelector('#hotspots');
const sceneNameEl = document.querySelector('#scene-name');
const loadingEl   = document.querySelector('#loading-screen');
const selectEl    = document.querySelector('#scene-select');

/**
 * Where to draw the circle for `toId` while standing at `fromId`:
 * the floor point under the target camera, relative to the current eye,
 * converted to A-Frame axes. Far targets are pulled closer along the same
 * direction, so the circle still sits exactly over that spot in the image.
 * In a headset the panorama is seen at the sky radius, so every circle is also
 * pulled in to just inside that sphere (and shrunk by the same factor, `k`):
 * both eyes then see it lying on the floor in the picture, not floating behind it.
 */
function markerPosition (fromId, toId) {
  const eye = SCENES[fromId].eye, t = SCENES[toId];
  let x = t.eye.x - eye.x, y = t.floorZ - eye.z, z = -(t.eye.y - eye.y);
  const d = Math.hypot(x, y, z);
  const above = y > -0.3;                     // target floor is at/above eye height (stairs up)
  if (d > MAX_MARKER_M) { const s = MAX_MARKER_M / d; x *= s; y *= s; z *= s; }
  const shown = Math.min(d, MAX_MARKER_M);
  const onSky = skyRadius(fromId) * 0.92;     // just in front of the panorama surface
  const k = shown > onSky ? onSky / shown : 1;
  return { x: x * k, y: y * k, z: z * k, d, k, above };
}

/* ── Hotspot builder: a Street-View style circle lying on the floor ── */
function buildHotspot (toId, p) {
  const root = document.createElement('a-entity');
  root.setAttribute('position', `${p.x.toFixed(3)} ${p.y.toFixed(3)} ${p.z.toFixed(3)}`);
  root.setAttribute('scale', `${p.k} ${p.k} ${p.k}`);   // same size on screen after being pulled in

  // Flat on the floor when the target is below eye level; facing the viewer for stairs going up.
  const plate = document.createElement('a-entity');
  if (p.above) plate.setAttribute('face-camera', '');
  else plate.setAttribute('rotation', '-90 0 0');
  root.appendChild(plate);

  // Grow circles with distance so far ones stay easy to see and click (near ones stay life-size).
  const shown = Math.min(p.d, MAX_MARKER_M);
  const scale = Math.max(1, Math.min(3.2, shown / 4));
  const r = CIRCLE_RADIUS * scale;

  const disc = document.createElement('a-circle');
  disc.setAttribute('id', 'disc-' + toId);
  disc.setAttribute('radius', r);
  disc.setAttribute('material', 'color: #ffffff; opacity: 0.28; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(disc);

  const ring = document.createElement('a-ring');
  ring.setAttribute('radius-inner', r * 1.02);
  ring.setAttribute('radius-outer', r * 1.18);
  ring.setAttribute('material', 'color: #ffffff; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(ring);

  const progress = document.createElement('a-ring');
  progress.setAttribute('id', 'pr-' + toId);
  progress.setAttribute('radius-inner', r * 1.22);
  progress.setAttribute('radius-outer', r * 1.36);
  progress.setAttribute('theta-start', 90);
  progress.setAttribute('theta-length', 0);
  progress.setAttribute('material', 'color: #ffffff; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(progress);

  const pulse = document.createElement('a-ring');
  pulse.setAttribute('radius-inner', r * 1.2);
  pulse.setAttribute('radius-outer', r * 1.3);
  pulse.setAttribute('material', 'color: #ffffff; opacity: 0.35; transparent: true; shader: flat; side: double; depthTest: false');
  pulse.setAttribute('animation__s', 'property: scale; from: 1 1 1; to: 1.6 1.6 1.6; loop: true; dur: 2200; easing: easeOutCubic');
  pulse.setAttribute('animation__o', 'property: material.opacity; from: 0.35; to: 0; loop: true; dur: 2200; easing: easeOutCubic');
  plate.appendChild(pulse);

  // Invisible, slightly larger hit area for easy clicking / gazing
  const hit = document.createElement('a-circle');
  hit.setAttribute('class', 'hs-target');
  hit.setAttribute('radius', r * 1.6);
  hit.setAttribute('material', 'opacity: 0.0; transparent: true; shader: flat; side: double; depthWrite: false');
  hit.setAttribute('hotspot-nav', `targetId: ${toId}; progressRing: #pr-${toId}; disc: #disc-${toId}`);
  plate.appendChild(hit);

  // Label floating above the circle, always readable. Show the floor when the circle leads to a different area.
  const t = SCENES[toId];
  const here = SCENES[currentScene];
  const name = (t.area !== here.area && !t.name.toLowerCase().startsWith(t.area.toLowerCase()))
    ? `${t.area} · ${t.name}` : t.name;   // e.g. "Second Floor · Staircase 1" when the circle leads to another floor
  const label = document.createElement('a-entity');
  label.setAttribute('face-camera', '');
  label.setAttribute('position', `0 ${(r * 1.6 + 0.25).toFixed(2)} 0`);
  const bg = document.createElement('a-plane');
  bg.setAttribute('width', Math.max(0.9, name.length * 0.085) * scale * 0.8);
  bg.setAttribute('height', 0.2 * scale * 0.8);
  bg.setAttribute('material', 'color: #000000; opacity: 0.7; transparent: true; shader: flat; side: double; depthTest: false');
  label.appendChild(bg);
  const txt = document.createElement('a-text');
  txt.setAttribute('value', name);
  txt.setAttribute('align', 'center');
  txt.setAttribute('color', '#ffffff');
  txt.setAttribute('width', 1.6 * scale * 0.8);
  txt.setAttribute('position', '0 0 0.01');
  txt.setAttribute('material', 'depthTest: false');
  label.appendChild(txt);
  root.appendChild(label);

  return root;
}

/* Rebuild the circles: only this camera's neighbours from the walk graph */
function refreshHotspots () {
  while (hotspotsEl.firstChild) hotspotsEl.removeChild(hotspotsEl.firstChild);
  for (const id of SCENES[currentScene].neighbours) {
    if (!SCENES[id]) continue;
    hotspotsEl.appendChild(buildHotspot(id, markerPosition(currentScene, id)));
  }
  if (wideView && wideView.active) wideView.refreshMarkers();
}

/* ══════════════════════════════════════════════════════════════════════
   FADE, IMAGE LOADING, NAVIGATION
══════════════════════════════════════════════════════════════════════ */
function animateFade (toOpacity, durationMs) {
  return new Promise(resolve => {
    fadeEl.setAttribute('visible', true);
    fadeEl.setAttribute('animation', `property: material.opacity; to: ${toOpacity}; dur: ${durationMs}; easing: easeInOutQuad`);
    setTimeout(resolve, durationMs + 20);
  });
}

function preloadImg (url) {
  if (!url || loadedUrls.has(url) || failedUrls.has(url)) return Promise.resolve();
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => { loadedUrls.add(url); resolve(); };
    img.onerror = () => { failedUrls.add(url); resolve(); };
    img.src = url;
  });
}

/* Panorama sphere radius = the depth both eyes perceive for the whole image in a headset.
   Far away (490 m) makes rooms feel giant; room-sized distances make them feel life-size.
   ?r=<metres> overrides it everywhere (for trying values on the Quest). */
const SKY_R_OVERRIDE = parseFloat(new URLSearchParams(location.search).get('r'));
const OPEN_AIR = /^(out_|tf_terrace|tf_roof|tf_covered)/;
function skyRadius (sceneId) {
  if (SKY_R_OVERRIDE >= 1 && SKY_R_OVERRIDE <= 490) return SKY_R_OVERRIDE;
  return OPEN_AIR.test(sceneId) ? 15 : 2.5;
}

function applySky (sceneId) {
  const s = SCENES[sceneId];
  skyEl.setAttribute('radius', skyRadius(sceneId));
  if (s.image && loadedUrls.has(s.image)) { skyEl.removeAttribute('color'); skyEl.setAttribute('src', s.image); }
  else { skyEl.removeAttribute('src'); skyEl.setAttribute('color', s.placeholderColor); }
}

function updateHud () {
  const s = SCENES[currentScene];
  // Show the floor too, unless the name already says it (e.g. "Ground Floor Entrance", "Turf")
  sceneNameEl.textContent = (s.area && !s.name.toLowerCase().startsWith(s.area.toLowerCase())) ? `${s.area} · ${s.name}` : s.name;
  selectEl.value = currentScene;
}

async function navigateTo (targetId) {
  if (transitioning || targetId === currentScene || !SCENES[targetId]) return;
  transitioning = true;
  await animateFade(1, 420);
  await preloadImg(SCENES[targetId].image);
  currentScene = targetId;
  if (TURN_ON_ARRIVAL[currentScene]) turnView(TURN_ON_ARRIVAL[currentScene]);   // while the screen is black
  applySky(currentScene);
  refreshHotspots();
  updateHud();
  await new Promise(r => setTimeout(r, 120));      // let THREE upload the texture
  await animateFade(0, 500);
  fadeEl.setAttribute('visible', false);
  transitioning = false;
  setTimeout(() => SCENES[currentScene].neighbours.forEach(id => preloadImg(SCENES[id].image)), 800);
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
/* Dropdown grouped by floor / area, in walking order */
const AREA_ORDER = ['Outdoor', 'Turf', 'Ground Floor', 'First Floor', 'Second Floor', 'Third Floor'];
const areas = [...new Set(SCENE_IDS.map(id => SCENES[id].area))]
  .sort((a, b) => (AREA_ORDER.indexOf(a) + 99) % 99 - (AREA_ORDER.indexOf(b) + 99) % 99);
for (const area of areas) {
  const g = document.createElement('optgroup');
  g.label = area || 'Other';
  for (const id of SCENE_IDS.filter(id => SCENES[id].area === area)) {
    const o = document.createElement('option');
    o.value = id; o.textContent = SCENES[id].name;
    g.appendChild(o);
  }
  selectEl.appendChild(g);
}
selectEl.addEventListener('change', e => navigateTo(e.target.value));

async function init () {
  await preloadImg(SCENES[START_SCENE].image);
  applySky(START_SCENE);
  refreshHotspots();
  updateHud();
  loadingEl.style.opacity = '0';
  setTimeout(() => { loadingEl.style.display = 'none'; }, 650);

  const hint = document.querySelector('#nav-hint'), ua = navigator.userAgent;
  if (/Quest/i.test(ua))               hint.textContent = 'Point at a circle and pull the trigger — or gaze at it — to walk there · thumbstick left/right to turn · hold A or X for Wide view · hold B or Y for 2 s to exit VR';
  else if (/Mobi|Android/i.test(ua))   hint.textContent = 'Tap a circle on the floor to walk there';
  else                                 hint.textContent = 'Click a circle on the floor to walk there · drag to look around · VR button for headsets';

  setTimeout(() => SCENES[START_SCENE].neighbours.forEach(id => preloadImg(SCENES[id].image)), 1500);
  if (new URLSearchParams(location.search).get('vr') === '1' && navigator.xr)   // "View in VR" link on the home page
    navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) openGuide(); }).catch(() => {});
}

/* ?r=<metres> — panorama sphere radius. In a headset this sets the depth the eyes perceive
   for the whole image (small = close, room-sized; large = far away). For trying values on Quest. */
const aScene = document.querySelector('#a-scene');
aScene.addEventListener('enter-vr', () => {
  document.querySelector('#hud').style.opacity = '0';
  document.querySelector('#back-btn').style.opacity = '0';
  document.querySelector('#wide-btn').style.opacity = '0';
  document.querySelector('#vr-btn').style.opacity = '0';
  selectEl.style.opacity = '0';
  closeWide();
});
aScene.addEventListener('exit-vr', () => {
  document.querySelector('#hud').style.opacity = '1';
  document.querySelector('#back-btn').style.opacity = '1';
  document.querySelector('#wide-btn').style.opacity = '1';
  document.querySelector('#vr-btn').style.opacity = '1';
  selectEl.style.opacity = '1';
});

/* ── Wide view (page): the whole 2:1 panorama image with the circles marked on it ── */
const wideOverlay = document.querySelector('#wide-overlay');
function renderWide () {
  const s = SCENES[currentScene];
  document.querySelector('#wide-title').textContent = sceneNameEl.textContent;
  document.querySelector('#wide-img').src = s.image;
  const pins = document.querySelector('#wide-pins');
  pins.innerHTML = '';
  for (const id of s.neighbours) {
    if (!SCENES[id]) continue;
    const p = markerPosition(currentScene, id), { u, v } = directionToUV(p.x, p.y, p.z), t = SCENES[id];
    const pin = document.createElement('button');
    pin.className = 'wide-pin';
    pin.style.left = (u * 100) + '%'; pin.style.top = ((1 - v) * 100) + '%';
    pin.innerHTML = '<span class="ring"></span><span class="name"></span>';
    pin.querySelector('.name').textContent = (t.area !== s.area && !t.name.toLowerCase().startsWith(t.area.toLowerCase())) ? `${t.area} · ${t.name}` : t.name;
    pin.addEventListener('click', async () => { await navigateTo(id); renderWide(); });
    pins.appendChild(pin);
  }
}
function openWide () { renderWide(); wideOverlay.classList.add('open'); }
function closeWide () { wideOverlay.classList.remove('open'); }
document.querySelector('#wide-btn').addEventListener('click', openWide);
document.querySelector('#wide-close').addEventListener('click', closeWide);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeWide(); closeGuide(); } });

/* ── Enter VR: controller guide (one control per step), then VR starts ── */
/* A Quest Touch controller seen from above. `on` lists the parts to highlight:
   'stick', 'trigger', 'top' (Y / B), 'bottom' (X / A); `arrows` adds ◀ ▶ around the thumbstick. */
function controllerSVG (hand, on, arrows) {
  const L = hand === 'left';
  const stick = { x: L ? 64 : 96, y: 56 };
  const top = { x: L ? 104 : 56, y: 76, t: L ? 'Y' : 'B' }, bottom = { x: L ? 94 : 66, y: 106, t: L ? 'X' : 'A' };
  const cls = part => on.includes(part) ? 'ctl-hl' : 'ctl-part';
  return `<svg viewBox="0 -26 160 236" role="img" aria-label="${hand} controller">
    <text class="ctl-label" x="80" y="-16" style="${on.includes('trigger') ? 'fill:#00c8ff' : ''}">Trigger</text>
    <path class="${cls('trigger')}" d="M58 12 Q80 0 102 12 L98 21 Q80 11 62 21 Z"/>
    <path class="ctl-body" d="M40 42 Q40 16 80 16 Q120 16 120 42 L120 100 Q120 128 104 140 L96 196 Q80 206 64 196 L56 140 Q40 128 40 100 Z"/>
    <circle class="${cls('stick')}" cx="${stick.x}" cy="${stick.y}" r="17"/>
    <circle cx="${stick.x}" cy="${stick.y}" r="7" fill="rgba(0,0,0,0.25)"/>
    ${arrows ? `<text class="ctl-arrow" x="${stick.x - 27}" y="${stick.y}">◀</text><text class="ctl-arrow" x="${stick.x + 27}" y="${stick.y}">▶</text>` : ''}
    <circle class="${cls('top')}" cx="${top.x}" cy="${top.y}" r="11"/><text class="ctl-label${on.includes('top') ? ' on' : ''}" x="${top.x}" y="${top.y}">${top.t}</text>
    <circle class="${cls('bottom')}" cx="${bottom.x}" cy="${bottom.y}" r="11"/><text class="ctl-label${on.includes('bottom') ? ' on' : ''}" x="${bottom.x}" y="${bottom.y}">${bottom.t}</text>
    <circle class="ctl-part" cx="80" cy="130" r="5"/>
  </svg>`;
}
const GUIDE_STEPS = [
  { title: 'Turn around', on: ['stick'], arrows: true,
    text: 'Push either thumbstick left or right to turn 30°. You can also simply turn your head.' },
  { title: 'Walk to the next view', on: ['trigger'],
    text: 'Point the controller at a circle on the floor and pull the trigger. Or look at a circle for 2 seconds.' },
  { title: 'Wide view', on: ['bottom'],
    text: 'Hold A or X for 1 second to see the whole image on a big screen. Hold it again to go back to 360.' },
  { title: 'Exit VR', on: ['top'],
    text: 'Hold B or Y for 2 seconds to leave VR and come back to this page.' },
];
const guideEl = document.querySelector('#guide');
let guideStep = 0;
const GUIDE_KEY = 'arch360.hideVrGuide';
function guideHidden () { try { return localStorage.getItem(GUIDE_KEY) === '1'; } catch (e) { return false; } }
function renderGuide () {
  const s = GUIDE_STEPS[guideStep], last = guideStep === GUIDE_STEPS.length - 1;
  document.querySelector('#guide-step-no').textContent = `Quest controls · ${guideStep + 1} of ${GUIDE_STEPS.length}`;
  document.querySelector('#guide-title').textContent = s.title;
  document.querySelector('#guide-text').textContent = s.text;
  document.querySelector('#guide-pics').innerHTML =
    `<div>${controllerSVG('left', s.on, s.arrows)}<div class="cap">Left</div></div>` +
    `<div>${controllerSVG('right', s.on, s.arrows)}<div class="cap">Right</div></div>`;
  document.querySelector('#guide-dots').innerHTML = GUIDE_STEPS.map((_, i) => `<span class="${i === guideStep ? 'on' : ''}"></span>`).join('');
  document.querySelector('#guide-back').disabled = guideStep === 0;
  document.querySelector('#guide-next').textContent = last ? 'Enter VR' : 'Next';
}
function openGuide () {
  if (guideHidden()) { startVR(); return; }
  guideStep = 0; renderGuide(); guideEl.classList.add('open');
  document.querySelector('#guide-next').focus();
}
function closeGuide () { guideEl.classList.remove('open'); }
function startVR () {
  try { if (document.querySelector('#guide-hide').checked) localStorage.setItem(GUIDE_KEY, '1'); } catch (e) {}
  closeGuide(); closeWide();
  Promise.resolve(aScene.enterVR()).catch(() => {});
}
document.querySelector('#vr-btn').addEventListener('click', openGuide);
document.querySelector('#guide-back').addEventListener('click', () => { if (guideStep > 0) { guideStep--; renderGuide(); } });
document.querySelector('#guide-next').addEventListener('click', () => {
  if (guideStep < GUIDE_STEPS.length - 1) { guideStep++; renderGuide(); } else startVR();
});
document.querySelector('#guide-skip').addEventListener('click', startVR);
guideEl.addEventListener('click', e => { if (e.target === guideEl) closeGuide(); });
// Only offer VR where a headset can actually be used (Quest browser, PC VR)
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => { if (ok) document.querySelector('#vr-btn').classList.add('show'); }).catch(() => {});
}
aScene.addEventListener('loaded', init);
</script>
</body>
</html>
