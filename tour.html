<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ARCH 360 Tour</title>

  <!-- A-Frame 1.5.0 — no extra dependencies needed -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Camera positions + walk graph exported from the Blender scene -->
  <script src="tour_data.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; overflow: hidden; height: 100%; }

    /* Loading overlay */
    #loading-screen {
      position: fixed; inset: 0;
      background: #080c12;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 200;
      color: #e8edf2;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.6s ease;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 22px;
    }
    .loading-title  { font-size: 1.1em; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
    .loading-sub    { font-size: 0.72em; margin-top: 8px; opacity: 0.38; letter-spacing: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* HUD overlay — hidden in VR automatically */
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 18px 20px 28px;
      background: linear-gradient(transparent, rgba(0,0,0,0.65));
      text-align: center;
      pointer-events: none;
      z-index: 10;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: opacity 0.4s;
    }
    #scene-name {
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e8edf2;
      margin-bottom: 5px;
    }
    #nav-hint {
      font-size: clamp(10px, 1.8vw, 12px);
      color: rgba(232,237,242,0.4);
      letter-spacing: 1px;
    }

    /* Back button */
    #back-btn {
      position: fixed; top: 18px; left: 18px;
      background: rgba(8,12,18,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: rgba(232,237,242,0.65);
      font-size: 0.8em;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 9px 14px;
      display: flex; align-items: center; gap: 7px;
      backdrop-filter: blur(12px);
      z-index: 10;
      transition: color 0.2s, border-color 0.2s;
    }
    #back-btn:hover { color: #e8edf2; border-color: rgba(255,255,255,0.25); }

    #scene-select {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(0,0,0,1);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 12px;
      font-family: Avenir, sans-serif;
      font-size: 10px;
      outline: none;
      cursor: pointer;
      pointer-events: auto;
    }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p class="loading-title">ARCH 360 Tour</p>
  <p class="loading-sub">Preparing your experience…</p>
</div>

<!-- HUD -->
<a href="index.html" id="back-btn">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
</a>
<select id="scene-select"></select>
<div id="hud">
  <div id="scene-name">Loading…</div>
  <div id="nav-hint">Click a circle on the floor to walk there</div>
</div>

<!-- ═══════════════════════════════════════════════════════════ A-FRAME ══ -->
<a-scene
  id="a-scene"
  renderer="colorManagement: true; antialias: true; physicallyCorrectLights: false; renderScale: 1"
  vr-mode-ui="enabled: true"
  loading-screen="enabled: false"
  background="color: #000000">

  <!--
    Sky sphere. Every Blender camera faces world +Y, which becomes A-Frame −Z,
    so the centre of each panorama must sit in front of the viewer (−Z).
    A-Frame maps the image centre to −X by default, hence the −90° turn.
  -->
  <a-sky
    id="sky"
    radius="490"
    segments-height="64"
    segments-width="128"
    rotation="0 -90 0"
    color="#0d1a28">
  </a-sky>

  <!-- The viewer stands exactly where the Blender camera was (eye at the rig origin) -->
  <a-entity id="rig" position="0 0 0">
    <a-entity
      id="cam"
      camera="fov: 80; near: 0.05; far: 600"
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; pointerLockEnabled: false"
      position="0 0 0">

      <!-- Gaze cursor: fuse = fires "click" after fuseTimeout ms of hover (VR / phone) -->
      <a-entity
        id="gaze-cursor"
        cursor="fuse: true; fuseTimeout: 1800; rayOrigin: entity"
        raycaster="objects: .hs-target; far: 600; interval: 80"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.011"
        material="color: #ffffff; shader: flat; opacity: 0.8; transparent: true"
        animation__fusing_scale="property: scale; startEvents: fusing; from: 1 1 1; to: 1.3 1.3 1.3; dur: 1800; easing: easeInQuad"
        animation__leave_scale="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200"
        animation__click_pop="property: scale; startEvents: click; from: 0.7 0.7 0.7; to: 1 1 1; dur: 300">
      </a-entity>

      <!-- Fade plane — black quad in front of the camera for scene transitions -->
      <a-plane
        id="fade"
        width="6" height="6"
        position="0 0 -1"
        material="color: #000000; opacity: 0; transparent: true; shader: flat; depthTest: false; depthWrite: false"
        visible="false">
      </a-plane>
    </a-entity>

    <!-- Quest / PCVR controllers -->
    <a-entity id="ctrl-left"  laser-controls="hand: left"  raycaster="objects: .hs-target; showLine: false; far: 600"></a-entity>
    <a-entity id="ctrl-right" laser-controls="hand: right" raycaster="objects: .hs-target; showLine: true; lineColor: #ffffff; lineOpacity: 0.5; far: 600"></a-entity>
  </a-entity>

  <!-- Mouse / touch clicking on desktop & phone -->
  <a-entity id="mouse-cursor" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .hs-target; far: 600"></a-entity>

  <!-- Hotspot container — rebuilt on every scene change -->
  <a-entity id="hotspots"></a-entity>
</a-scene>

<script>
/* ══════════════════════════════════════════════════════════════════════
   TOUR CONFIGURATION
   Scenes, positions and neighbours come from tour_data.js (exported from
   the Blender file). Blender is Z-up, A-Frame is Y-up:
     aframe.x =  blender.x,  aframe.y = blender.z,  aframe.z = -blender.y
══════════════════════════════════════════════════════════════════════ */
const START_SCENE    = 'camera_001';
const GAZE_MS        = 1800;   // must match the gaze cursor fuseTimeout
const MAX_MARKER_M   = 14;     // far circles are pulled in to this distance (direction is kept)
const CIRCLE_RADIUS  = 0.32;   // metres, at true distance → far circles look smaller, like Street View

/* 4K panoramas (3840×1920) — fit every GPU, including phones and Quest. */
const IMG_DIR = 'images/pano/';

const SCENES = {};
for (const s of window.TOUR_SCENES) {
  SCENES[s.id] = {
    name:        s.placeholder ? `${s.name} (coming soon)` : s.name,
    area:        s.area || '',
    image:       IMG_DIR + s.id + '.jpg',
    eye:         { x: s.pos[0], y: s.pos[1], z: s.pos[2] },   // Blender coords
    floorZ:      s.floorZ,
    neighbours:  s.neighbours,
    placeholderColor: '#0d1a28'
  };
}
const SCENE_IDS = Object.keys(SCENES);

/* ══════════════════════════════════════════════════════════════════════
   CUSTOM A-FRAME COMPONENTS
══════════════════════════════════════════════════════════════════════ */

/* face-camera — keeps labels turned toward the viewer */
AFRAME.registerComponent('face-camera', {
  init () { this.camEl = document.querySelector('#cam'); this._v = new THREE.Vector3(); },
  tick () { this.camEl.object3D.getWorldPosition(this._v); this.el.object3D.lookAt(this._v); }
});

/* hotspot-nav — gaze progress ring + navigation on click */
AFRAME.registerComponent('hotspot-nav', {
  schema: { targetId: { type: 'string' }, progressRing: { type: 'selector' }, disc: { type: 'selector' } },
  init () {
    this._onClick = () => navigateTo(this.data.targetId);
    this._onEnter = this._onEnter.bind(this);
    this._onLeave = this._onLeave.bind(this);
    this.el.addEventListener('click', this._onClick);
    this.el.addEventListener('mouseenter', this._onEnter);
    this.el.addEventListener('fusing', this._onEnter);
    this.el.addEventListener('mouseleave', this._onLeave);
  },
  remove () {
    this.el.removeEventListener('click', this._onClick);
    this.el.removeEventListener('mouseenter', this._onEnter);
    this.el.removeEventListener('fusing', this._onEnter);
    this.el.removeEventListener('mouseleave', this._onLeave);
  },
  _onEnter (e) {
    const { progressRing, disc } = this.data;
    if (disc) disc.setAttribute('material', 'opacity', 0.55);
    if (progressRing && e.type === 'fusing') {
      progressRing.setAttribute('animation__prog',
        { property: 'geometry.thetaLength', from: 0, to: 360, dur: GAZE_MS, easing: 'linear' });
    }
  },
  _onLeave () {
    const { progressRing, disc } = this.data;
    if (disc) disc.setAttribute('material', 'opacity', 0.28);
    if (progressRing) { progressRing.removeAttribute('animation__prog'); progressRing.setAttribute('geometry', 'thetaLength', 0); }
  }
});

/* ══════════════════════════════════════════════════════════════════════
   TOUR STATE & HELPERS
══════════════════════════════════════════════════════════════════════ */
let currentScene  = START_SCENE;
let transitioning = false;
const loadedUrls  = new Set();
const failedUrls  = new Set();

const skyEl       = document.querySelector('#sky');
const fadeEl      = document.querySelector('#fade');
const hotspotsEl  = document.querySelector('#hotspots');
const sceneNameEl = document.querySelector('#scene-name');
const loadingEl   = document.querySelector('#loading-screen');
const selectEl    = document.querySelector('#scene-select');

/**
 * Where to draw the circle for `toId` while standing at `fromId`:
 * the floor point under the target camera, relative to the current eye,
 * converted to A-Frame axes. Far targets are pulled closer along the same
 * direction, so the circle still sits exactly over that spot in the image.
 */
function markerPosition (fromId, toId) {
  const eye = SCENES[fromId].eye, t = SCENES[toId];
  let x = t.eye.x - eye.x, y = t.floorZ - eye.z, z = -(t.eye.y - eye.y);
  const d = Math.hypot(x, y, z);
  if (d > MAX_MARKER_M) { const k = MAX_MARKER_M / d; x *= k; y *= k; z *= k; }
  return { x, y, z, d, above: y > -0.3 };   // above = target floor is at/above eye height (stairs up)
}

/* ── Hotspot builder: a Street-View style circle lying on the floor ── */
function buildHotspot (toId, p) {
  const root = document.createElement('a-entity');
  root.setAttribute('position', `${p.x.toFixed(3)} ${p.y.toFixed(3)} ${p.z.toFixed(3)}`);

  // Flat on the floor when the target is below eye level; facing the viewer for stairs going up.
  const plate = document.createElement('a-entity');
  if (p.above) plate.setAttribute('face-camera', '');
  else plate.setAttribute('rotation', '-90 0 0');
  root.appendChild(plate);

  // Grow circles with distance so far ones stay easy to see and click (near ones stay life-size).
  const shown = Math.min(p.d, MAX_MARKER_M);
  const scale = Math.max(1, Math.min(3.2, shown / 4));
  const r = CIRCLE_RADIUS * scale;

  const disc = document.createElement('a-circle');
  disc.setAttribute('id', 'disc-' + toId);
  disc.setAttribute('radius', r);
  disc.setAttribute('material', 'color: #ffffff; opacity: 0.28; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(disc);

  const ring = document.createElement('a-ring');
  ring.setAttribute('radius-inner', r * 1.02);
  ring.setAttribute('radius-outer', r * 1.18);
  ring.setAttribute('material', 'color: #ffffff; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(ring);

  const progress = document.createElement('a-ring');
  progress.setAttribute('id', 'pr-' + toId);
  progress.setAttribute('radius-inner', r * 1.22);
  progress.setAttribute('radius-outer', r * 1.36);
  progress.setAttribute('theta-start', 90);
  progress.setAttribute('theta-length', 0);
  progress.setAttribute('material', 'color: #ffffff; opacity: 0.95; transparent: true; shader: flat; side: double; depthTest: false');
  plate.appendChild(progress);

  const pulse = document.createElement('a-ring');
  pulse.setAttribute('radius-inner', r * 1.2);
  pulse.setAttribute('radius-outer', r * 1.3);
  pulse.setAttribute('material', 'color: #ffffff; opacity: 0.35; transparent: true; shader: flat; side: double; depthTest: false');
  pulse.setAttribute('animation__s', 'property: scale; from: 1 1 1; to: 1.6 1.6 1.6; loop: true; dur: 2200; easing: easeOutCubic');
  pulse.setAttribute('animation__o', 'property: material.opacity; from: 0.35; to: 0; loop: true; dur: 2200; easing: easeOutCubic');
  plate.appendChild(pulse);

  // Invisible, slightly larger hit area for easy clicking / gazing
  const hit = document.createElement('a-circle');
  hit.setAttribute('class', 'hs-target');
  hit.setAttribute('radius', r * 1.6);
  hit.setAttribute('material', 'opacity: 0.0; transparent: true; shader: flat; side: double; depthWrite: false');
  hit.setAttribute('hotspot-nav', `targetId: ${toId}; progressRing: #pr-${toId}; disc: #disc-${toId}`);
  plate.appendChild(hit);

  // Label floating above the circle, always readable. Show the floor when the circle leads to a different area.
  const t = SCENES[toId];
  const name = t.area && t.area !== SCENES[currentScene].area ? `${t.area} · ${t.name}` : t.name;
  const label = document.createElement('a-entity');
  label.setAttribute('face-camera', '');
  label.setAttribute('position', `0 ${(r * 1.6 + 0.25).toFixed(2)} 0`);
  const bg = document.createElement('a-plane');
  bg.setAttribute('width', Math.max(0.9, name.length * 0.085) * scale * 0.8);
  bg.setAttribute('height', 0.2 * scale * 0.8);
  bg.setAttribute('material', 'color: #000000; opacity: 0.7; transparent: true; shader: flat; side: double; depthTest: false');
  label.appendChild(bg);
  const txt = document.createElement('a-text');
  txt.setAttribute('value', name);
  txt.setAttribute('align', 'center');
  txt.setAttribute('color', '#ffffff');
  txt.setAttribute('width', 1.6 * scale * 0.8);
  txt.setAttribute('position', '0 0 0.01');
  txt.setAttribute('material', 'depthTest: false');
  label.appendChild(txt);
  root.appendChild(label);

  return root;
}

/* Rebuild the circles: only this camera's neighbours from the walk graph */
function refreshHotspots () {
  while (hotspotsEl.firstChild) hotspotsEl.removeChild(hotspotsEl.firstChild);
  for (const id of SCENES[currentScene].neighbours) {
    if (!SCENES[id]) continue;
    hotspotsEl.appendChild(buildHotspot(id, markerPosition(currentScene, id)));
  }
}

/* ══════════════════════════════════════════════════════════════════════
   FADE, IMAGE LOADING, NAVIGATION
══════════════════════════════════════════════════════════════════════ */
function animateFade (toOpacity, durationMs) {
  return new Promise(resolve => {
    fadeEl.setAttribute('visible', true);
    fadeEl.setAttribute('animation', `property: material.opacity; to: ${toOpacity}; dur: ${durationMs}; easing: easeInOutQuad`);
    setTimeout(resolve, durationMs + 20);
  });
}

function preloadImg (url) {
  if (!url || loadedUrls.has(url) || failedUrls.has(url)) return Promise.resolve();
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => { loadedUrls.add(url); resolve(); };
    img.onerror = () => { failedUrls.add(url); resolve(); };
    img.src = url;
  });
}

function applySky (sceneId) {
  const s = SCENES[sceneId];
  if (s.image && loadedUrls.has(s.image)) { skyEl.removeAttribute('color'); skyEl.setAttribute('src', s.image); }
  else { skyEl.removeAttribute('src'); skyEl.setAttribute('color', s.placeholderColor); }
}

function updateHud () {
  const s = SCENES[currentScene];
  sceneNameEl.textContent = s.area ? `${s.area} · ${s.name}` : s.name;
  selectEl.value = currentScene;
}

async function navigateTo (targetId) {
  if (transitioning || targetId === currentScene || !SCENES[targetId]) return;
  transitioning = true;
  await animateFade(1, 420);
  await preloadImg(SCENES[targetId].image);
  currentScene = targetId;
  applySky(currentScene);
  refreshHotspots();
  updateHud();
  await new Promise(r => setTimeout(r, 120));      // let THREE upload the texture
  await animateFade(0, 500);
  fadeEl.setAttribute('visible', false);
  transitioning = false;
  setTimeout(() => SCENES[currentScene].neighbours.forEach(id => preloadImg(SCENES[id].image)), 800);
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
/* Dropdown grouped by floor / area, in walking order */
const AREA_ORDER = ['Outdoor', 'Turf', 'Ground Floor', 'First Floor', 'Second Floor', 'Third Floor'];
const areas = [...new Set(SCENE_IDS.map(id => SCENES[id].area))]
  .sort((a, b) => (AREA_ORDER.indexOf(a) + 99) % 99 - (AREA_ORDER.indexOf(b) + 99) % 99);
for (const area of areas) {
  const g = document.createElement('optgroup');
  g.label = area || 'Other';
  for (const id of SCENE_IDS.filter(id => SCENES[id].area === area)) {
    const o = document.createElement('option');
    o.value = id; o.textContent = SCENES[id].name;
    g.appendChild(o);
  }
  selectEl.appendChild(g);
}
selectEl.addEventListener('change', e => navigateTo(e.target.value));

async function init () {
  await preloadImg(SCENES[START_SCENE].image);
  applySky(START_SCENE);
  refreshHotspots();
  updateHud();
  loadingEl.style.opacity = '0';
  setTimeout(() => { loadingEl.style.display = 'none'; }, 650);

  const hint = document.querySelector('#nav-hint'), ua = navigator.userAgent;
  if (/Quest/i.test(ua))               hint.textContent = 'Point at a circle and pull the trigger — or gaze at it — to walk there';
  else if (/Mobi|Android/i.test(ua))   hint.textContent = 'Tap a circle on the floor to walk there';
  else                                 hint.textContent = 'Click a circle on the floor to walk there · drag to look around · VR button for headsets';

  setTimeout(() => SCENES[START_SCENE].neighbours.forEach(id => preloadImg(SCENES[id].image)), 1500);
  if (new URLSearchParams(location.search).get('vr') === '1') aScene.enterVR();
}

const aScene = document.querySelector('#a-scene');
aScene.addEventListener('enter-vr', () => {
  document.querySelector('#hud').style.opacity = '0';
  document.querySelector('#back-btn').style.opacity = '0';
  selectEl.style.opacity = '0';
});
aScene.addEventListener('exit-vr', () => {
  document.querySelector('#hud').style.opacity = '1';
  document.querySelector('#back-btn').style.opacity = '1';
  selectEl.style.opacity = '1';
});
aScene.addEventListener('loaded', init);
</script>
</body>
</html>
